<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>页面不存在·序时SynchroCampus</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        background: #f3f0ee;
        color: #4a4458;
        text-autospace: normal;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141217;
          color: #b8b2c4;
        }
      }
      .card {
        text-align: center;
        padding: 24px;
      }
      .code {
        font-size: 72px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.1;
        color: #a0529e;
      }
      @media (prefers-color-scheme: dark) {
        .code {
          color: #ddaacc;
        }
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 12px 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 10px 28px;
        border-radius: 999px;
        background: #ddaacc;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
      a:hover {
        filter: brightness(0.96);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>页面不存在</h1>
      <p>你要找的页面不在这里。链接可能已失效，或地址输入有误。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
