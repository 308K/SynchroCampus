<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="序时 SynchroCampus —— 基于离散时空碰撞与启发式约束规划的群体日程自协同决策智能体"
    />
    <title>序时 SynchroCampus · 群体日程自协同</title>
    <script>
      // 主题预置：避免深色模式首帧闪烁（Mantine localStorage key）
      ;(function () {
        try {
          var scheme = localStorage.getItem('mantine-color-scheme')
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme === 'dark' ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
