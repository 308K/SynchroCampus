<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="序时SynchroCampus——基于离散时空碰撞与启发式约束规划的群体日程自协同决策智能体"
    />
    <meta name="theme-color" content="#8450ff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>序时SynchroCampus·群体日程自协同</title>
    <script>
      // 主题预置：避免深色模式首帧闪烁（Mantine localStorage key）
      ;(function () {
        try {
          var scheme = localStorage.getItem('mantine-color-scheme')
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme === 'dark' ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
