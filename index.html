<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="序时SynchroCampus——基于离散时空碰撞与启发式约束规划的群体日程自协同决策智能体"
    />
    <meta name="theme-color" content="#ddaacc" />
    <!-- 相对引用 public/：Bun dev 的 HTML 管道要求可解析；构建脚本会重写为根路径并平铺 -->
    <link rel="manifest" href="public/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="public/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>序时SynchroCampus·群体日程自协同</title>
    <script>
      // 主题预置：默认跟随系统偏好；用户手动切换后以 localStorage 为准（避免首帧闪烁）
      // key 与 Mantine v7 localStorageColorSchemeManager 默认值保持一致
      ;(function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value')
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var scheme = stored === 'dark' || stored === 'light' ? stored : systemDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
